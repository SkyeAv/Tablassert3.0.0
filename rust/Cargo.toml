[package]
name = "tablassert-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "tablassert_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bincode = "1"
flate2 = "1"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
pyo3 = "0.29"
rayon = "1"
redb = "2"
rlimit = "0.10"
rustc-hash = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v3"] }
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }

[dev-dependencies]
bincode = "1"
flate2 = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"

# Curated low-false-positive clippy lints enforced across the crate (lib +
# tests + examples).  Deliberately NOT denied: needless_pass_by_value and
# doc_markdown (too noisy / stylistic for this codebase).
[lints.clippy]
use_self = "deny"
uninlined_format_args = "deny"
redundant_closure_for_method_calls = "deny"
explicit_iter_loop = "deny"
match_same_arms = "deny"
unnested_or_patterns = "deny"
