[package]
name = "tablassert-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "tablassert_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bincode = "1"
flate2 = "1"
memmap2 = "0.9"
md5 = "0.7"
pyo3 = "0.29"
rayon = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"
