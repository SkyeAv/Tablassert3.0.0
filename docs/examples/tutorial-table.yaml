template:
  syntax: TC3
  status: alpha
  source:
    kind: text
    local: ./docs/examples/tutorial-data.csv
    url: https://example.com/data.csv
    row_slice:
      - 1
      - auto
    delimiter: ","
  statement:
    subject:
      method: column
      encoding: A
      prioritize:
        - Gene
    predicate: associated_with
    object:
      method: column
      encoding: B
      prioritize:
        - Disease
  provenance:
    repo: PMID
    publication: "12345678"
    contributors:
      - kind: curation
        name: Tutorial Example
        date: 27 JAN 2026
        organizations:
          - Example Institute
        comment: Synthetic tutorial data for Tablassert documentation
  annotations:
    - annotation: p_value
      method: column
      encoding: C
    - annotation: sample_size
      method: column
      encoding: D
