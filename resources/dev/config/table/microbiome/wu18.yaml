template:
  location:
    where_to_download_data_from: https://ndownloader.figstatic.com/collections/7296079/versions/1
    download_hyperparameters:
      extension: xlsx
      which_excel_sheet_to_use: Table S18
      start_at_line_number: 4
  provenance:
    article_curie: PMC:PMC11224521
    config_curator_name: Skye Lane Goetz
    config_curator_organization: Institute for Systems Biology
  attributes:
    sample_size:
      encoding_method: value
      value_for_encoding: 613
    p_value:
      encoding_method: column_of_values
      value_for_encoding: I
    assertion_strength:
      encoding_method: column_of_values
      value_for_encoding: E
    assertion_method:
      encoding_method: value
      value_for_encoding: Spearman correlation
    notes: Age-associated genus identified by MaAsLin in each age group.
  triple:
    triple_subject: 
      encoding_method: column_of_values
      value_for_encoding: B
      mapping_hyperparameters:
        classes_to_prioritize:
          - biolink:OrganismTaxon
        substrings_to_remove:
          - ^.*?\.
          - \..*$
          - _.+$
          - '7'
          - Family
    triple_object:
      value_for_encoding: age
    triple_predicate: biolink:associated_with

sections:
  - ~