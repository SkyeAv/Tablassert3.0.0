# Trimmed from TableConfigs/TABLE/MOKG/CHENG1.yaml (template-only legacy shape):
# template-level source/statement/provenance/annotations, a ./DATALAKE local, the old
# relationship_strength annotation, and a valid reindex block.
template:
  source:
    kind: excel
    local: ./DATALAKE/CHENG1.xlsx
    url:
      - https://pmc.ncbi.nlm.nih.gov/articles/instance/7878905/bin/41467_2020_20877_MOESM4_ESM.xlsx
    row_slice:
      - 5
      - 184
    sheet: SD4
    reindex:
      - column: A
        comparison: ne
        comparator: "N/A"
  provenance:
    repo: PMC
    publication: PMC7878905
  statement:
    subject:
      method: column
      encoding: B
      taxon: 9606
      prioritize:
        - Gene
    predicate: genetically_associated_with
    object:
      method: column
      encoding: A
      prioritize:
        - SmallMolecule
  annotations:
    - annotation: sample_size
      method: value
      encoding: 4864
    - annotation: relationship_strength
      method: column
      encoding: D
    - annotation: effect_type
      method: value
      encoding: log beta coefficient
