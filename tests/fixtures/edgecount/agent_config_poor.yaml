# US-007 edge-count acceptance: the intentionally-IMPOVERISHED agent fixture (negative
# test). The degraded pre-US-006 shape: a SINGLE section that reads the multi-valued
# locus_hits sheet WITHOUT explode_by, so each ;-joined "diseases" cell stays one
# unresolvable blob and strict entity resolution drops every row. Its edge count lands
# far below REFERENCE_EDGE_FRACTION x reference_edges, which is exactly the regression
# tests/test_agent_edgecount.py must catch. SYNTHETIC + OFFLINE; see README.md.
template:
  provenance:
    repo: PMC
    publication: PMC10766526
sections:
  - source:
      kind: excel
      local: ./payload.xlsx
      url:
        - https://pmc.ncbi.nlm.nih.gov/articles/instance/10766526/bin/edgecount-payload.xlsx
      sheet: locus_hits
      row_slice:
        - 2
        - auto
    statement:
      subject:
        method: column
        encoding: A
        prioritize:
          - Gene
      predicate: associated_with
      object:
        method: column
        encoding: B
        prioritize:
          - Disease
    annotations:
      - annotation: effect_size
        method: column
        encoding: C
      - annotation: p_value
        method: column
        encoding: D
      - annotation: effect_type
        method: value
        encoding: regression_coefficient
