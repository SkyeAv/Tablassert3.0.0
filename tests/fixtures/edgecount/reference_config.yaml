# US-007 edge-count acceptance: the REFERENCE fixture. Mirrors the PMC10766526
# disease x system style exhaustively: one section per payload sheet (3 sections vs the
# agent fixture's 2), so the reference edge count is strictly richer and the
# REFERENCE_EDGE_FRACTION gate in tests/test_agent_edgecount.py is meaningful.
# SYNTHETIC + OFFLINE: cell values are fabricated; see README.md.
template:
  provenance:
    repo: PMC
    publication: PMC10766526
sections:
  - source:
      kind: excel
      local: ./payload.xlsx
      url:
        - https://pmc.ncbi.nlm.nih.gov/articles/instance/10766526/bin/edgecount-payload.xlsx
      sheet: disease_system
      row_slice:
        - 2
        - auto
    statement:
      subject:
        method: column
        encoding: A
        prioritize:
          - Disease
      predicate: associated_with
      object:
        method: column
        encoding: B
        prioritize:
          - AnatomicalEntity
    annotations:
      - annotation: effect_size
        method: column
        encoding: C
      - annotation: p_value
        method: column
        encoding: D
      - annotation: effect_type
        method: value
        encoding: regression_coefficient
  - source:
      kind: excel
      local: ./payload.xlsx
      url:
        - https://pmc.ncbi.nlm.nih.gov/articles/instance/10766526/bin/edgecount-payload.xlsx
      sheet: locus_hits
      row_slice:
        - 2
        - auto
    statement:
      subject:
        method: column
        encoding: A
        prioritize:
          - Gene
      predicate: associated_with
      object:
        method: column
        encoding: B
        prioritize:
          - Disease
        explode_by: ";"
    annotations:
      - annotation: effect_size
        method: column
        encoding: C
      - annotation: p_value
        method: column
        encoding: D
      - annotation: effect_type
        method: value
        encoding: regression_coefficient
  - source:
      kind: excel
      local: ./payload.xlsx
      url:
        - https://pmc.ncbi.nlm.nih.gov/articles/instance/10766526/bin/edgecount-payload.xlsx
      sheet: secondary_endpoints
      row_slice:
        - 2
        - auto
    statement:
      subject:
        method: column
        encoding: A
        prioritize:
          - Disease
      predicate: associated_with
      object:
        method: column
        encoding: B
        prioritize:
          - AnatomicalEntity
    annotations:
      - annotation: effect_size
        method: column
        encoding: C
      - annotation: p_value
        method: column
        encoding: D
      - annotation: effect_type
        method: value
        encoding: regression_coefficient
