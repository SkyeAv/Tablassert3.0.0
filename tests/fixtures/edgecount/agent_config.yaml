# US-007 edge-count acceptance: the IMPROVED-AGENT fixture (US-006 shape).
# Multi-section ({template, sections}), each section targets the correct sheet with the
# correct row_slice (row 0 title + row 1 header skipped), and gains breadth via
# prioritize (disease/system sections) and explode_by (the ;-joined locus_hits sheet).
# Every section carries the statistical annotation PAIR: effect_size from a column +
# effect_type as a method:value constant (an unpaired half would be dropped by
# Section.drop_unpaired_effect_annotations). Covers 2 of the 3 payload sheets, so its
# edge count is a strict, meaningful fraction of the richer reference config's.
# SYNTHETIC + OFFLINE: mirrors the PMC10766526 disease x system style; see README.md.
template:
  provenance:
    repo: PMC
    publication: PMC10766526
sections:
  - source:
      kind: excel
      local: ./payload.xlsx
      url:
        - https://pmc.ncbi.nlm.nih.gov/articles/instance/10766526/bin/edgecount-payload.xlsx
      sheet: disease_system
      row_slice:
        - 2
        - auto
    statement:
      subject:
        method: column
        encoding: A
        prioritize:
          - Disease
      predicate: associated_with
      object:
        method: column
        encoding: B
        prioritize:
          - AnatomicalEntity
    annotations:
      - annotation: effect_size
        method: column
        encoding: C
      - annotation: p_value
        method: column
        encoding: D
      - annotation: effect_type
        method: value
        encoding: regression_coefficient
  - source:
      kind: excel
      local: ./payload.xlsx
      url:
        - https://pmc.ncbi.nlm.nih.gov/articles/instance/10766526/bin/edgecount-payload.xlsx
      sheet: locus_hits
      row_slice:
        - 2
        - auto
    statement:
      subject:
        method: column
        encoding: A
        prioritize:
          - Gene
      predicate: associated_with
      object:
        method: column
        encoding: B
        prioritize:
          - Disease
        explode_by: ";"
    annotations:
      - annotation: effect_size
        method: column
        encoding: C
      - annotation: p_value
        method: column
        encoding: D
      - annotation: effect_type
        method: value
        encoding: regression_coefficient
