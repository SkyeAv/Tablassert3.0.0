# Trimmed from TableConfigs/TABLE/MOKG/CORREIA1.yaml (template + sections legacy shape):
# shared source/statement/provenance/annotations on the template, per-section sheet/object
# overrides, and the space-separated "relationship strength" annotation alias in a section.
template:
  source:
    kind: excel
    local: ./DATALAKE/CORREIA1.xlsx
    url:
      - https://pmc.ncbi.nlm.nih.gov/articles/instance/11530135/bin/jciinsight-9-178645-s129.xlsx
    row_slice:
      - 2
      - auto
  statement:
    subject:
      method: column
      encoding: B
      prioritize:
        - Protein
        - Gene
      taxon: 9606
    predicate: correlated_with
  provenance:
    repo: PMC
    publication: "PMC11530135"
  annotations:
    - annotation: sample size
      method: value
      encoding: 84

sections:
  - source:
      sheet: "Data File 4"
    statement:
      object:
        method: value
        encoding: mitochondrial disease
        prioritize:
          - Disease
    annotations:
      - annotation: p value
        method: column
        encoding: BA
      - annotation: relationship strength
        method: column
        encoding: AU

  - source:
      sheet: "Data File 5"
    statement:
      object:
        method: value
        encoding: "mitochondrial oxidative phosphorylation disorder"
        prioritize:
          - Disease
    annotations:
      - annotation: p value
        method: column
        encoding: BI
      - annotation: effect size
        method: column
        encoding: D
      - annotation: effect type
        method: value
        encoding: log2 fold change
