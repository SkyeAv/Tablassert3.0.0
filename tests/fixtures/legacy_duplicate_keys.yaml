# Synthetic legacy fixture: DUPLICATE-KEY mapping. A curator split one logical template
# across two `template:` blocks; PyYAML's safe_load silently keeps only the LAST block.
# The legacy loader merges both occurrences (dict+dict deep-merge) and fires one
# LegacyDuplicateKeyWarning naming the key, so the converted section carries every field
# from BOTH occurrences (source/provenance from the first, statement/annotations from the
# second) and validates cleanly — the paired effect size/effect type annotations survive.
template:
  source:
    kind: excel
    local: ./DATALAKE/DUPKEYS1.xlsx
    url:
      - https://example.com/dupkeys1.xlsx
    sheet: Table 1
  provenance:
    repo: PMC
    publication: PMC3333333
template:
  statement:
    subject:
      method: column
      encoding: A
    predicate: correlated_with
    object:
      method: column
      encoding: B
  annotations:
    - annotation: sample size
      method: value
      encoding: 100
    - annotation: effect size
      method: column
      encoding: C
    - annotation: effect type
      method: value
      encoding: log2 fold change
