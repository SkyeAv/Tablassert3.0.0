# Synthetic legacy fixture: PAIRING GAP. The legacy `relationship strength` alias renames
# to `effect_size` during conversion, but the section declares NO sibling `effect_type`.
# Conversion keeps the renamed annotation (pairing policy does not live in the converter);
# Section validation then DROPS the orphan with UnpairedEffectAnnotationWarning (US-001)
# instead of failing the section.
template:
  source:
    kind: excel
    local: ./DATALAKE/PAIRGAP1.xlsx
    url:
      - https://example.com/pairgap1.xlsx
    sheet: Results
  provenance:
    repo: PMC
    publication: PMC4444444
  statement:
    subject:
      method: column
      encoding: A
    predicate: correlated_with
    object:
      method: column
      encoding: B
  annotations:
    - annotation: relationship strength
      method: column
      encoding: C
