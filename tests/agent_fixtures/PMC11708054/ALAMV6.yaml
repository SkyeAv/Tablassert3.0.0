# Reference table config for PMC11708054 (microbiome ~ tamoxifen correlations).
# Faithful copy of the `template:` block documented in docs/configuration/advanced-example.md
# (the ALAMV6 excel config). Schema-valid: validate_section(open(...).read()) is True.
# SYNTHETIC + OFFLINE fixture: the `local` excel path is illustrative only; nothing here
# touches the network or an LLM. See README.md for attribution.
template:
  source:
    kind: excel
    local: ./DATALAKE/ALAM.XLSX
    url: https://pmc.ncbi.nlm.nih.gov/articles/instance/11708054/bin/mbio.01679-24-s0006.xlsx
    row_slice:
      - 2
      - auto
    sheet: all correlations
  statement:
    subject:
      method: column
      encoding: A
      taxon: null
      prioritize:
        - OrganismTaxon
      avoid:
        - Gene
      remove:
        - "^NA "
      regex:
        - pattern: ".*g__"
          replacement: ""
        - pattern: ";s__"
          replacement: " "
        - pattern: "sp"
          replacement: "sp. "
    predicate: correlated_with
    object:
      method: value
      encoding: CHEBI:41774
  provenance:
    repo: PMC
    publication: PMC11708054
  annotations:
    - annotation: sample_size
      method: value
      encoding: 9
    - annotation: p_value
      method: column
      encoding: C
    - annotation: multiple_testing_correction_method
      method: value
      encoding: Benjamini Hochberg
    - annotation: relationship_strength
      method: column
      encoding: B
    - annotation: assertion_method
      method: value
      encoding: Spearman correlation
    - annotation: miscellaneous_notes
      method: value
      encoding: Correlation analysis between microbial composition and 13C-tamoxifen abundance after FDR correction
