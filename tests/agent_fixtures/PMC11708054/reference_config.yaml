# Golden config the agent should approximate, trimmed to source_table.csv's columns.
# Schema-valid (validate_section True). Unlike ALAMV6.yaml (excel, full annotation set,
# lineage-glue regex), this trimmed config reads the synthetic headerless CSV directly:
#   column A = organism name (subject, OrganismTaxon), B = Spearman rho, C = p_value;
#   object is the fixed literal CHEBI:41774 (13C-tamoxifen). The reference KGX is computed
#   in-test from this config against a tiny real redb (see README.md) — nothing large is committed.
template:
  source:
    kind: text
    local: ./source_table.csv
    url:
      - https://example.org/PMC11708054/source_table.csv
    delimiter: ","
  statement:
    subject:
      method: column
      encoding: A
      taxon: null
      prioritize:
        - OrganismTaxon
      avoid:
        - Gene
    predicate: correlated_with
    object:
      method: value
      encoding: CHEBI:41774
  provenance:
    repo: PMC
    publication: PMC11708054
  annotations:
    - annotation: sample_size
      method: value
      encoding: 9
    - annotation: p_value
      method: column
      encoding: C
    - annotation: relationship_strength
      method: column
      encoding: B
