# Second golden fixture (W6 offline fidelity): a gene~disease association table, distinct from the
# organism~chemical PMC11708054 fixture. Shaped as a multi-section table config ({template, sections})
# to exercise the W3 validate-all gate / section expansion on a fixture. Schema-valid
# (validate_table_config True). column A = gene (subject, Gene), B = disease (object, Disease),
# C = p_value annotation. Provenance is PMID (a journal article), unlike PMC11708054's PMC provenance.
template:
  provenance:
    repo: PMID
    publication: "12345678"
sections:
  - source:
      kind: text
      local: ./source_table.csv
      url: https://example.org/GENE_DISEASE/source_table.csv
      delimiter: ","
    statement:
      subject:
        method: column
        encoding: A
        prioritize:
          - Gene
      predicate: associated_with
      object:
        method: column
        encoding: B
        prioritize:
          - Disease
    annotations:
      - annotation: p_value
        method: column
        encoding: C
