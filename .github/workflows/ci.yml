name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both syncing jobs install this EXACT set, so they share one warm uv cache instead of
  # racing to save mutually-useless ones. See the `ci` group in pyproject.toml.
  SYNC_ARGS: --no-default-groups --group ci --extra qc

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Ruff runs standalone: `ruff check` measures 0s, so a full `uv sync` in front of it was
      # ~40s of pure overhead. `version-file` reads the resolved pin (0.15.12) out of uv.lock,
      # which is the same version .pre-commit-config.yaml pins, so local and CI cannot drift.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4
        with:
          version-file: uv.lock
          args: check --output-format=github
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4
        with:
          version-file: uv.lock
          args: format --check

  python-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
          # `prune-cache` is NOT on by default; without it the saved cache carries both the
          # zipped and unzipped copy of every wheel, which matters a lot with the qc extra.
          prune-cache: true
          cache-suffix: ci-qc
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      - name: Pyright
        run: uv run pyright

  python-test:
    runs-on: ubuntu-latest
    strategy:
      # Report every shard's failures, not just the first to fail.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Without this every shard is a distinct cache key, so shards 2-4 build cold.
          shared-key: maturin-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true
          cache-suffix: ci-qc
      - name: Sync dependencies
        run: uv sync --frozen ${{ env.SYNC_ARGS }}
      # Kept per-shard on purpose: hoisting this into a build-once job that uploads a wheel
      # costs more in extra job setup + artifact round-trip than the ~15s it saves in each
      # shard, because the shards run in parallel and the build job would be serial.
      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/Cargo.toml
      # `-n auto` (pyproject addopts) still parallelises within a shard across the runner's
      # cores. `--cov-report=` suppresses the per-shard report; the real number is produced
      # by the `coverage` job after combining all four data files.
      - name: Run tests
        run: uv run pytest --splits 4 --group ${{ matrix.shard }} --cov-report=
      - name: Name the coverage data file
        run: mv .coverage .coverage.${{ matrix.shard }}
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  coverage:
    needs: python-test
    # Report the combined number even when a shard fails, so a red test run still shows what
    # it covered. No threshold is enforced (there is no fail_under), so this job is
    # informational and cannot fail the run on coverage alone.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
        continue-on-error: true
      - name: Combine and report
        run: |
          set -euo pipefail
          # Every shard failing is already reported by python-test; don't pile a second,
          # more confusing failure on top of it just because there was nothing to combine.
          if ! compgen -G '.coverage.*' > /dev/null; then
            echo "No coverage data was produced -- see the python-test jobs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uvx coverage combine
          uvx coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          uvx coverage report

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cargo fmt
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: Cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path rust/Cargo.toml
