name: Deploy to PyPI
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release
      - name: Build sdist
        run: uv build --sdist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
