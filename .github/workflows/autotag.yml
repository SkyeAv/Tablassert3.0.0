name: Auto Tag Versions
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy to PyPI"
    types:
      - completed
    branches:
      - main
permissions:
  contents: write
jobs:
  autotag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Autotag using pyproject.toml
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_VERSION: 7.1.0
          TAG_PREFIX: v
          DEFAULT_BUMP: minor
