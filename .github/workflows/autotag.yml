name: Auto Tag

on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  autotag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Autotag using pyproject.toml
        uses: butlerlogic/action-autotag@1.0.1
        with:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          tag_prefix: "v"
          strategy: python
