[project]
name = "tablassert"
version = "8.0.0"
description = "Extract knowledge assertions from tabular data into NCATS Translator-compliant KGX NDJSON — declaratively, with entity resolution and quality control built in."
authors = [
    { name = "Skye Lane Goetz", email = "sgoetz@isbscience.org" }
]
keywords = [
    "knowledge graph",
    "bioinformatics",
    "entity resolution",
    "ner",
    "ncats translator",
    "kgx",
    "yaml configuration",
    "table mining",
    "declarative pipeline",
    "data quality control",
    "tablassert",
]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Framework :: Pydantic",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Console",
]
requires-python = ">=3.11"
dependencies = [
    "biolink-model>=4.4.3",
    "loguru>=0.7.3",
    "polars>=1.39.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "cyclopts>=1.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/SkyeAv/Tablassert"
Source = "https://github.com/SkyeAv/Tablassert"
Documentation = "https://skyeav.github.io/Tablassert/"

[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "tablassert.rs"
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"
features = ["extension-module"]

[project.scripts]
tablassert = "tablassert.cli:APP"

[project.optional-dependencies]
rt = [
    "polars[rtcompat]>=1.40.1",
]
qc = [
    "rapidfuzz>=3.14.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
]
agent = [
    "smolagents==1.26.0",
    "dspy==3.2.1",
    "litellm",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "maturin>=1.10,<2.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tablassert --cov-report=term-missing"
markers = ["network: requires internet"]

[tool.coverage.run]
source = ["src/tablassert"]

[tool.ruff]
line-length = 150
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", # pycodestyle E4xx
    "E7", # pycodestyle E7xx
    "E9", # pycodestyle E9xx
    "F", # pyflakes
    "RUF100", # stale noqa
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "PT", # flake8-pytest-style
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports
    "I", # isort
    "PIE", # flake8-pie
    "RET", # flake8-return
    "UP", # pyupgrade
]
ignore = [
    "UP042", # keep enum/str-conversion behavior as-is
]

[tool.ruff.lint.isort]
# Align isort with `format.skip-magic-trailing-comma = true` (avoids the ruff incompatibility warning).
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDuplicateImport = true
