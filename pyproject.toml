# 2025 Skye Lane Goetz

[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tablassert"
version = "4.0.0"
authors = [{name = "Skye Lane Goetz", email = "sgoetz@isbscience.org"}]
description = """
    Tablassert is a versatile tool that creates knowledge assertions from
    tabular data, enhances knowledge with configurable options, and exports
    KGX-compliant TSVs.
"""
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13.3"
dependencies = [
    # "polars[polars-calamine]>=1.27.1",
    # "camelot-py[base]>=1.0.0",
    # "pandas>=2.1.0",
    # "spacy>=3.8.2",
    "pyyaml>=6.0.2",
    # "joblib>=1.4.2",
    # "loguru>=0.7.3",
    "rich<14.0.0",
    "typer>=0.15.2",
    "pydantic>=2.10.3",
    # "python-dotenv>=1.1.0",
    # "numba>=0.61.2",
    "adapt-parser>=1.0.0",
    "numpy>=1.26.4",
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "atomic-agents>=1.1.0",
]

[project.scripts]
tablassert = "tablassert.cli:app"

[project.urls]
Home = "https://github.com/SkyeAv/Tablassert"

[project.optional-dependencies]
dev = [
    "flake8>=7.2.0",
    "flake8-pyproject>=1.2.3",
    "black>=25.1.0",
    "pytest>=8.3.5"
]

[tool.flake8]
max-line-length = 88
ignore = [
    "E203",
    "E501",
    "W503",
    "F722"
]
exclude = [
    ".git",
    "__pycache__",
    "*.pyc"
]

[tool.black]
line-length = 88
target-version = ["py313"]
