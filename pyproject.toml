# 2025 Skye Lane Goetz

[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Tablassert"
version = "4.0.0"
authors = [{name = "Skye Lane Goetz", email = "sgoetz@isbscience.org"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version", "description"]
requires-python = ">=3.13.3"
dependencies = [
    "polars[polars-calamine]>=1.27.1",
    "camelot-py[base]>=1.0.0",
    "pandas>=2.1.0",
    "spacy>=3.8.5",
    "pyyaml>=6.0.2",
    "joblib>=1.4.2",
    "loguru>=0.7.3",
    "rich>=14.0.0",
    "typer>=0.15.2",
    "pydantic>=2.11.3",
    "python-dotenv>=1.1.0",
    "numba>=0.61.2"
]

[project.urls]
Home = "https://github.com/SkyeAv/Tablassert"

[project.optional-dependencies]
dev = [
    "flake8>=7.2.0",
    "flake8-pyproject>=1.2.3",
    "black>=25.1.0",
    "pytest>=8.3.5"
]

[tool.flake8]
max-line-length = 88
ignore = [
    "E203",
    "E501",
    "W503",
    "F722"
]
exclude = [
    ".git",
    "__pycache__",
    "*.pyc"
]

[tool.black]
line-length = 88
target-version = ["py313"]

[project.scripts]
