[project]
name = "tablassert"
version = "8.0.0"
description = "Extract knowledge assertions from tabular data into NCATS Translator-compliant KGX NDJSON — declaratively, with entity resolution and quality control built in."
authors = [
    { name = "Skye Lane Goetz", email = "sgoetz@isbscience.org" }
]
keywords = [
    "knowledge graph",
    "bioinformatics",
    "entity resolution",
    "ner",
    "ncats translator",
    "kgx",
    "yaml configuration",
    "table mining",
    "declarative pipeline",
    "data quality control",
    "tablassert",
]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pydantic",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.0",
    "lazy-loader>=0.5",
    "loguru>=0.7.3",
    "orjson>=3.11.7",
    "polars>=1.39.0",
    "polars-hash>=0.5.6",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "cyclopts>=1.0.0",
    "rich>=13.0.0",
    "xxhash>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/SkyeAv/Tablassert"
Source = "https://github.com/SkyeAv/Tablassert"
Documentation = "https://skyeav.github.io/Tablassert/"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "tablassert._native"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[project.scripts]
tablassert = "tablassert.cli:APP"

[project.optional-dependencies]
rt = [
    "polars[rtcompat]>=1.40.1",
]
qc = [
    "onnxruntime>=1.24.4",
    "rapidfuzz>=3.14.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "optimum-onnx>=0.1.0",
    "numpy>=2.4.4",
]
qc-cuda = [
    "onnxruntime-gpu>=1.24.4",
    "rapidfuzz>=3.14.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "optimum-onnx>=0.1.0",
    "numpy>=2.4.4",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pre-commit>=4.5.1",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet", "gpu: requires CUDAExecutionProvider"]

[tool.ruff]
line-length = 150
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
