[project]
name = "tablassert"
version = "7.0.1"
description = "Tablassert is a highly performant declarative knowledge graph backend designed to extract knowledge assertions from tabular data while exporting NCATS Translator-compliant Knowledge Graph Exchange (KGX) NDJSON."
authors = [
    { name = "Skye Lane Goetz", email = "sgoetz@isbscience.org" },
    { name = "Gwennen Glusman", email = "gglusman@isbscience.org" },
    { name = "Jared C. Roach" },
]
keywords = [
    "knowledge graph",
    "natural language processing",
    "ner",
    "ncats translator",
    "yaml configuration",
    "table mining",
    "declarative pipeline",
    "tablassert"
]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.13"
dependencies = [
    "diskcache>=5.6.3",
    "duckdb>=1.5.0",
    "fastexcel>=0.19.0",
    "loguru>=0.7.3",
    "mkdocs>=1.6.1",
    "onnxruntime>=1.24.3",
    "optimum-onnx>=0.1.0",
    "orjson>=3.11.7",
    "playwright>=1.58.0",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pyexcel>=0.7.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "sqlite-utils>=3.39",
    "typer>=0.24.1",
    "xxhash>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/SkyeAv/Tablassert"
Source = "https://github.com/SkyeAv/Tablassert"
Documentation = "https://skyeav.github.io/Tablassert/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./src/tablassert"]

[project.scripts]
tablassert = "tablassert.lib:CLI"

[project.optional-dependencies]
rtcompat = [
    "polars[rtcompat]>=1.39.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
